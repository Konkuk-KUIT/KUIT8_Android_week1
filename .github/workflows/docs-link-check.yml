name: Docs Link Check

# 마크다운이 바뀐 PR 에서 문서 안 로컬 링크가 실제 파일을 가리키는지 본다.
# 경고만 남기고 PR 을 막지 않는다.
on:
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 문서 링크 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: node .github/scripts/check-doc-links.mjs
